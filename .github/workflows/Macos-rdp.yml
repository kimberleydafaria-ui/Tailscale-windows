
name: Bulk Latest macOS Remote Control

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-remote:
    name: Latest macOS Remote Desktop
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - name: Verify Latest macOS
        shell: bash
        run: |
          echo "===== MACOS SYSTEM ====="
          sw_vers
          echo "Architecture:"
          uname -m
          echo "CPU:"
          sysctl -n hw.ncpu
          echo "RAM:"
          sysctl -n hw.memsize
          df -h /

          if [ "$(uname -m)" != "arm64" ]; then
            echo "ERROR: Apple Silicon required"
            exit 1
          fi

      - name: Validate Secrets
        shell: bash
        env:
          ZT_NETWORK_ID: ${{ secrets.ZEROTIER_NETWORK_ID }}
          ZT_TOKEN: ${{ secrets.ZEROTIER_CENTRAL_TOKEN }}
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          test -n "$ZT_NETWORK_ID" || exit 1
          test -n "$ZT_TOKEN" || exit 1

          if [ "${#ZT_NETWORK_ID}" -ne 16 ]; then
            echo "Invalid ZeroTier network ID"
            exit 1
          fi

          if [ "${#VNC_PASSWORD}" -ne 8 ]; then
            echo "VNC password must be 8 characters"
            exit 1
          fi

          echo "Secrets validated"

      - name: Join ZeroTier Network
        uses: zerotier/github-action@v1.0.1
        with:
          network_id: ${{ secrets.ZEROTIER_NETWORK_ID }}
          auth_token: ${{ secrets.ZEROTIER_CENTRAL_TOKEN }}

      - name: Verify ZeroTier
        shell: bash
        env:
          ZT_NETWORK_ID: ${{ secrets.ZEROTIER_NETWORK_ID }}
        run: |
          echo "Checking ZeroTier network..."

          for i in {1..30}; do
            INFO=$(sudo zerotier-cli -j listnetworks)

            STATUS=$(echo "$INFO" | jq -r \
              --arg id "$ZT_NETWORK_ID" \
              '.[] | select(.nwid == $id) | .status')

            if [ "$STATUS" = "OK" ]; then
              break
            fi

            sleep 2
          done

          if [ "$STATUS" != "OK" ]; then
            sudo zerotier-cli listnetworks
            exit 1
          fi

          IP=$(echo "$INFO" | jq -r \
            --arg id "$ZT_NETWORK_ID" \
            '.[] | select(.nwid == $id) |
            .assignedAddresses[]?' |
            grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+/' |
            head -n 1)

          if [ -z "$IP" ]; then
            echo "No ZeroTier IPv4 address"
            exit 1
          fi

          IP="${IP%%/*}"

          echo "ZEROTIER_IP=$IP" >> "$GITHUB_ENV"
          echo "Connected: $IP"

      - name: Force Enable Remote Management
        shell: bash
        run: |
          KICKSTART="/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart"

          if [ ! -x "$KICKSTART" ]; then
            echo "Remote Management tool unavailable"
            exit 1
          fi

          echo "Activating Apple Remote Desktop..."

          sudo "$KICKSTART" \
            -activate \
            -configure \
            -access -on \
            -privs -all \
            -restart \
            -agent

          echo "Granting all-user access privileges..."

          sudo "$KICKSTART" \
            -configure \
            -allowAccessFor \
            -allUsers \
            -privs -all

          echo "Remote Management configuration completed"

      - name: Enable VNC Authentication
        shell: bash
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          KICKSTART="/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart"

          sudo "$KICKSTART" \
            -configure \
            -clientopts \
            -setvnclegacy \
            -vnclegacy yes \
            -setvncpw \
            -vncpw "$VNC_PASSWORD"

          sudo "$KICKSTART" -restart -agent

          echo "VNC authentication configured"

      - name: Initialize macOS Display
        shell: bash
        run: |
          echo "Preventing sleep..."

          sudo pmset -a sleep 0
          sudo pmset -a displaysleep 0

          caffeinate -dimsu &
          echo $! > "$RUNNER_TEMP/caffeinate.pid"

          sleep 10

          echo "===== DISPLAY DIAGNOSTICS ====="

          echo "WindowServer:"
          pgrep -fl WindowServer || true

          echo "Login Window:"
          pgrep -fl loginwindow || true

          echo "Finder:"
          pgrep -fl Finder || true

          echo "Dock:"
          pgrep -fl Dock || true

          echo "Console User:"
          stat -f "%Su" /dev/console

          echo "GUI Session:"
          launchctl print "gui/$(id -u)" 2>&1 | head -n 30 || true

      - name: Restart Remote Desktop Services
        shell: bash
        run: |
          KICKSTART="/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart"

          sudo "$KICKSTART" -restart -agent

          sleep 5

          echo "Checking VNC..."

          if nc -z 127.0.0.1 5900; then
            echo "VNC port 5900 is listening"
          else
            echo "WARNING: VNC port is not listening"
          fi

      - name: Display Connection Details
        shell: bash
        run: |
          echo "================================"
          echo "LATEST MACOS REMOTE DESKTOP"
          echo "================================"

          echo "macOS:"
          sw_vers -productVersion

          echo "Architecture:"
          uname -m

          echo "ZeroTier IP:"
          echo "$ZEROTIER_IP"

          echo "VNC PORT:"
          echo "5900"

          echo "================================"
          echo "Connect using Android VNC Viewer"
          echo "================================"

      - name: Keep Remote Session Alive
        shell: bash
        run: |
          echo "Remote session running..."
          sleep 20400
          
