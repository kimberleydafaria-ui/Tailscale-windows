name: Bulk macOS M1 ZeroTier Desktop

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-desktop:
    name: Start macOS M1 Remote Desktop
    runs-on: macos-26
    timeout-minutes: 360

    steps:
      - name: Verify M1 Hardware
        shell: bash
        run: |
          echo "===== MACOS SYSTEM ====="
          sw_vers
          echo "Architecture: $(uname -m)"
          echo "CPU: $(sysctl -n hw.ncpu)"
          echo "RAM: $(sysctl -n hw.memsize)"
          df -h /

          if [ "$(uname -m)" != "arm64" ]; then
            echo "ERROR: ARM64 required"
            exit 1
          fi

      - name: Validate GitHub Secrets
        shell: bash
        env:
          ZT_NETWORK_ID: ${{ secrets.ZEROTIER_NETWORK_ID }}
          ZT_TOKEN: ${{ secrets.ZEROTIER_CENTRAL_TOKEN }}
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          test -n "$ZT_NETWORK_ID" || exit 1
          test -n "$ZT_TOKEN" || exit 1

          if [ "${#ZT_NETWORK_ID}" -ne 16 ]; then
            echo "Invalid ZeroTier network ID"
            exit 1
          fi

          if [ "${#VNC_PASSWORD}" -ne 8 ]; then
            echo "VNC password must be 8 characters"
            exit 1
          fi

          echo "Secrets validated"

      - name: Connect to ZeroTier
        uses: zerotier/github-action@v1.0.1
        with:
          network_id: ${{ secrets.ZEROTIER_NETWORK_ID }}
          auth_token: ${{ secrets.ZEROTIER_CENTRAL_TOKEN }}

      - name: Verify ZeroTier Network
        shell: bash
        env:
          ZT_NETWORK_ID: ${{ secrets.ZEROTIER_NETWORK_ID }}
        run: |
          echo "Checking ZeroTier..."

          for i in {1..30}; do
            INFO=$(sudo zerotier-cli -j listnetworks)

            STATUS=$(echo "$INFO" | jq -r \
              --arg id "$ZT_NETWORK_ID" \
              '.[] | select(.nwid == $id) | .status')

            if [ "$STATUS" = "OK" ]; then
              break
            fi

            sleep 2
          done

          if [ "$STATUS" != "OK" ]; then
            sudo zerotier-cli listnetworks
            exit 1
          fi

          IP=$(echo "$INFO" | jq -r \
            --arg id "$ZT_NETWORK_ID" \
            '.[] | select(.nwid == $id) |
            .assignedAddresses[]?' |
            grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+/' |
            head -n 1)

          if [ -z "$IP" ]; then
            echo "No managed IPv4 address assigned"
            exit 1
          fi

          IP="${IP%%/*}"

          echo "ZEROTIER_IP=$IP" >> "$GITHUB_ENV"

          echo "ZeroTier connected: $IP"

      - name: Enable macOS Remote Desktop
        shell: bash
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          KICKSTART="/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart"

          if [ ! -x "$KICKSTART" ]; then
            echo "Remote Management unavailable"
            exit 1
          fi

          sudo "$KICKSTART" \
            -activate \
            -configure \
            -access -on \
            -users "$(whoami)" \
            -privs -all

          sudo "$KICKSTART" \
            -configure \
            -clientopts \
            -setvnclegacy \
            -vnclegacy yes \
            -setvncpw \
            -vncpw "$VNC_PASSWORD"

          sudo "$KICKSTART" -restart -agent

          echo "Remote Desktop configured"

      - name: Initialize Display
        shell: bash
        run: |
          echo "Preventing system sleep..."

          sudo pmset -a sleep 0
          sudo pmset -a displaysleep 0

          caffeinate -dimsu &
          echo $! > "$RUNNER_TEMP/caffeinate.pid"

          sleep 5

          echo "Checking graphical processes..."

          pgrep -fl "WindowServer" || true
          pgrep -fl "loginwindow" || true
          pgrep -fl "Finder" || true
          pgrep -fl "Dock" || true

          echo "Console user:"
          stat -f "%Su" /dev/console

          echo "GUI session check:"
          launchctl print "gui/$(id -u)" 2>&1 | head -n 20 || true

      - name: Check VNC Service
        shell: bash
        run: |
          echo "Checking port 5900..."

          for i in {1..30}; do
            if nc -z 127.0.0.1 5900; then
              echo "VNC port is listening"
              break
            fi

            sleep 2
          done

          if ! nc -z 127.0.0.1 5900; then
            echo "VNC service is unavailable"
            exit 1
          fi

          echo "VNC service check passed"

      - name: Display Connection Information
        shell: bash
        run: |
          echo "=================================="
          echo "BULK MACOS M1 REMOTE DESKTOP"
          echo "=================================="

          echo "macOS version:"
          sw_vers -productVersion

          echo "Architecture:"
          uname -m

          echo "ZeroTier IP:"
          echo "$ZEROTIER_IP"

          echo "VNC port:"
          echo "5900"

          echo "=================================="
          echo "Connect using Android VNC Viewer"
          echo "=================================="

      - name: Keep Desktop Running
        shell: bash
        run: |
          echo "Keeping remote session alive..."
          sleep 20400
          
