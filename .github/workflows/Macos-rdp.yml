
name: Bulk macOS M1 Remote Desktop

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-rdp:
    name: Start macOS M1 Desktop
    runs-on: macos-26
    timeout-minutes: 360

    env:
      TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
      VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}

    steps:
      - name: Verify M1 Mac
        run: |
          echo "Checking macOS hardware..."
          sw_vers
          uname -m
          sysctl -n hw.ncpu
          sysctl -n hw.memsize
          df -h /

      - name: Validate Secrets
        shell: bash
        run: |
          if [ -z "$TS_AUTHKEY" ]; then
            echo "Missing TS_AUTHKEY secret"
            exit 1
          fi

          if [ "${#VNC_PASSWORD}" -ne 8 ]; then
            echo "VNC_PASSWORD must be exactly 8 characters"
            exit 1
          fi

      - name: Install Tailscale
        run: |
          brew install tailscale
          sudo brew services start tailscale

          for i in {1..30}; do
            if sudo tailscale status >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done

          sudo tailscale up \
            --auth-key="$TS_AUTHKEY" \
            --hostname="bulk-macos-${GITHUB_RUN_ID}"

      - name: Enable macOS Remote Desktop
        shell: bash
        run: |
          KICKSTART="/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart"

          sudo "$KICKSTART" \
            -activate \
            -configure \
            -access -on \
            -users "$(whoami)" \
            -privs -all

          sudo "$KICKSTART" \
            -configure \
            -clientopts \
            -setvnclegacy \
            -vnclegacy yes \
            -setvncpw \
            -vncpw "$VNC_PASSWORD"

          sudo "$KICKSTART" -restart -agent

      - name: Display Connection Details
        run: |
          echo "================================"
          echo "BULK MACOS REMOTE DESKTOP READY"
          echo "================================"
          echo "Architecture: $(uname -m)"
          echo "macOS: $(sw_vers -productVersion)"
          echo "Tailscale IP:"
          sudo tailscale ip -4
          echo "VNC Port: 5900"
          echo "================================"

      - name: Keep Desktop Running
        run: |
          echo "Remote desktop is running."
          sleep 20400
