
name: Bulk macOS M1 Remote Desktop

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-rdp:
    name: Start macOS M1 Desktop
    runs-on: macos-26
    timeout-minutes: 360

    env:
      TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}

    steps:
      - name: Verify macOS M1 Hardware
        shell: bash
        run: |
          echo "================================"
          echo "BULK MACOS M1 SYSTEM"
          echo "================================"
          sw_vers
          echo "Architecture:"
          uname -m
          echo "CPU:"
          sysctl -n hw.ncpu
          echo "RAM:"
          sysctl -n hw.memsize
          echo "Storage:"
          df -h /

          if [ "$(uname -m)" != "arm64" ]; then
            echo "ERROR: ARM64 machine required"
            exit 1
          fi

      - name: Validate Secrets
        shell: bash
        run: |
          if [ -z "$TS_AUTHKEY" ]; then
            echo "ERROR: TAILSCALE_AUTHKEY is missing"
            exit 1
          fi

          if [ "${#VNC_PASSWORD}" -ne 8 ]; then
            echo "ERROR: VNC_PASSWORD must be exactly 8 characters"
            exit 1
          fi

          echo "Secrets validation passed"

      - name: Install Tailscale
        shell: bash
        run: |
          brew install tailscale

          sudo brew services start tailscale

          echo "Waiting for Tailscale service..."

          for i in {1..30}; do
            if sudo tailscale status >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done

          sudo tailscale up \
            --auth-key="$TS_AUTHKEY" \
            --hostname="bulk-macos-${GITHUB_RUN_ID}" \
            --accept-dns=false

          echo "Tailscale connected successfully"

      - name: Enable macOS Remote Desktop
        shell: bash
        run: |
          KICKSTART="/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart"

          if [ ! -x "$KICKSTART" ]; then
            echo "ERROR: Apple Remote Desktop service not found"
            exit 1
          fi

          sudo "$KICKSTART" \
            -activate \
            -configure \
            -access -on \
            -users "$(whoami)" \
            -privs -all

          sudo "$KICKSTART" \
            -configure \
            -clientopts \
            -setvnclegacy \
            -vnclegacy yes \
            -setvncpw \
            -vncpw "$VNC_PASSWORD"

          sudo "$KICKSTART" -restart -agent

          echo "Remote Desktop configuration completed"

      - name: Display Connection Details
        shell: bash
        run: |
          echo "================================"
          echo "MACOS REMOTE DESKTOP"
          echo "================================"

          echo "macOS:"
          sw_vers -productVersion

          echo "Architecture:"
          uname -m

          echo "Tailscale IP:"
          sudo tailscale ip -4

          echo "VNC PORT:"
          echo "5900"

          echo "================================"
          echo "Use your VNC Viewer to connect"
          echo "================================"

      - name: Keep Desktop Running
        shell: bash
        run: |
          echo "Your macOS session is running."
          sleep 20400
          
